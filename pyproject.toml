[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulk-mailer"
version = "0.1.0"
description = "Asynchronous SQLite-backed bulk email dispatch and reporting engine with XML import/export support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.1",
    "defusedxml>=0.7.1",
    "jinja2>=3.1.4",
    "lxml>=5.2.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pydantic-xml[lxml]>=2.11.0",
    "typer>=0.12.3",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "radon>=6.0.1",
    "ruff>=0.5.5",
    "vulture>=2.11",
]

[project.scripts]
bulk-mailer = "bulk_mailer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_mailer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "C90",   # McCabe cyclomatic complexity
    "PLR",   # Pylint Refactor
    "PERF",  # Perflint 
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit 
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
